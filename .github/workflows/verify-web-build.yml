name: Build and Deploy GreenSight Web

on:
  push:
    branches:
      - main
    paths:
      - 'grennn_web/**'
      - 'wrangler.toml'
      - '.github/workflows/verify-web-build.yml'
  pull_request:
    paths:
      - 'grennn_web/**'
      - 'wrangler.toml'
      - '.github/workflows/verify-web-build.yml'
  workflow_dispatch:

concurrency:
  group: greensight-web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build and deploy

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22.12.0
          cache: 'npm'
          cache-dependency-path: grennn_web/package-lock.json

      - name: Install dependencies
        working-directory: grennn_web
        run: npm ci

      - name: Build
        working-directory: grennn_web
        run: npm run build

      - name: Verify dist directory
        run: |
          if [ -d "dist" ]; then
            echo "Dist directory found"
            ls -la dist
          else
            echo "Dist directory NOT found"
            ls -la
            exit 1
          fi

      - name: Upload dist artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: greensight-web-dist
          path: dist
          if-no-files-found: error
          retention-days: 7

      - name: Deploy to Cloudflare Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: grennn_web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          npx wrangler pages deploy ../dist \
            --project-name=chuanzhibei \
            --branch=${{ github.ref_name }} \
            --commit-hash=${{ github.sha }} \
            --commit-message="$COMMIT_MESSAGE"
