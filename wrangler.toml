# Cloudflare Pages 配置
name = "chuanzhibei"
compatibility_date = "2026-04-06"

# 构建配置
[build]
command = "cd grennn_web && npm ci && npm run build"
# 输出目录相对于项目根目录的路径
upload_dir = "grennn_web/dist"

# Pages 静态资源配置
[assets]
directory = "./grennn_web/dist"
not_found_handling = "single-page-application"

# 单页应用配置
[route]
pattern = "/*"
dest = "/index.html"
