name = "chuanzhibei"
compatibility_date = "2026-04-06"

# Cloudflare Pages 配置
[pages]
# 项目根目录
project_name = "chuanzhibei11"
# 构建配置
[pages.build]
command = "npm run build"
# 构建输出目录
output_dir = "grennn_web/dist"
# 部署后的网站访问路径
base_dir = "grennn_web"

[assets]
directory = "grennn_web/dist"
not_found_handling = "single-page-application"
